<ng-container *transloco="let t; read: 'scopeMatrix'">
  <section class="scope-matrix" data-testid="df-scope-matrix">
    <!-- Loading: skeleton grid -->
    <div *ngIf="loading" class="scope-matrix__loading">
      <df-skeleton variant="table-row" [count]="4"></df-skeleton>
    </div>

    <!-- Empty: no roles to place on the grid -->
    <df-empty-state
      *ngIf="!loading && rows.length === 0"
      icon="security"
      [title]="t('emptyTitle')"
      [description]="t('emptyHint')">
    </df-empty-state>

    <!-- Narrowing controls: which roles to list. Roles that reach the service
         lead by default; "all roles" proves absence of access, search finds
         one role by name in either view. -->
    <div
      *ngIf="!loading && rows.length > 0 && searchable"
      class="scope-matrix__toolbar">
      <label class="scope-matrix__search" data-testid="scope-matrix-search">
        <mat-icon aria-hidden="true">search</mat-icon>
        <input
          type="search"
          autocomplete="off"
          [ngModel]="query"
          (ngModelChange)="onQuery($event)"
          [placeholder]="t('searchPlaceholder')"
          [attr.aria-label]="t('searchPlaceholder')" />
      </label>
      <div class="scope-matrix__views" role="group">
        <button
          type="button"
          class="scope-matrix__view"
          [class.scope-matrix__view--active]="!showAll"
          [attr.aria-pressed]="!showAll"
          data-testid="scope-matrix-view-access"
          (click)="setShowAll(false)">
          {{ t('withAccess', { count: reachingRows.length }) }}
        </button>
        <button
          type="button"
          class="scope-matrix__view"
          [class.scope-matrix__view--active]="showAll"
          [attr.aria-pressed]="showAll"
          data-testid="scope-matrix-view-all"
          (click)="setShowAll(true)">
          {{ t('allRoles', { count: rows.length }) }}
        </button>
      </div>
    </div>

    <!-- The grid: roles (rows) x verbs (cols), inside a fixed-height well -->
    <div
      *ngIf="!loading && visibleRows.length > 0"
      class="scope-matrix__grid"
      [class.scope-matrix__grid--bounded]="searchable"
      role="table"
      data-testid="scope-matrix-grid"
      [attr.aria-label]="t('ariaLabel')">
      <!-- Header row -->
      <div class="scope-matrix__row scope-matrix__row--head" role="row">
        <span class="scope-matrix__corner" role="columnheader">{{
          t('roleHeader')
        }}</span>
        <span
          *ngFor="let v of verbs; trackBy: trackByVerb"
          class="scope-matrix__verb"
          role="columnheader"
          >{{ v }}</span
        >
      </div>

      <!-- One row per listed role -->
      <div
        *ngFor="let row of visibleRows; trackBy: trackByRoleId"
        class="scope-matrix__row"
        role="row"
        data-testid="scope-matrix-row">
        <span
          class="scope-matrix__role"
          role="rowheader"
          [title]="row.roleName"
          >{{ row.roleName }}</span
        >
        <button
          *ngFor="let v of verbs; trackBy: trackByVerb"
          type="button"
          class="scope-matrix__cell"
          [class.scope-matrix__cell--full]="cellState(row, v) === 'full'"
          [class.scope-matrix__cell--filtered]="
            cellState(row, v) === 'filtered'
          "
          [class.scope-matrix__cell--none]="cellState(row, v) === 'none'"
          [disabled]="cellState(row, v) === 'none'"
          role="cell"
          [attr.aria-label]="
            row.roleName + ' ' + v + ': ' + t('state.' + cellState(row, v))
          "
          [title]="t('state.' + cellState(row, v))"
          (click)="onCellClick(row, v)">
          <span class="scope-matrix__dot" aria-hidden="true"></span>
        </button>
      </div>

      <div *ngIf="hiddenCount > 0" class="scope-matrix__more">
        <button
          type="button"
          class="scope-matrix__more-btn"
          data-testid="scope-matrix-more"
          (click)="showMore()">
          {{ t('showMore', { count: nextPage }) }}
        </button>
      </div>
    </div>

    <p
      *ngIf="!loading && rows.length > 0 && statusKey"
      class="scope-matrix__status"
      data-testid="scope-matrix-status">
      {{ t(statusKey, statusParams) }}
    </p>

    <!-- Legend -->
    <div
      *ngIf="!loading && rows.length > 0"
      class="scope-matrix__legend"
      aria-hidden="true">
      <span class="scope-matrix__legend-item">
        <span class="scope-matrix__dot scope-matrix__dot--full"></span
        >{{ t('state.full') }}</span
      >
      <span class="scope-matrix__legend-item">
        <span class="scope-matrix__dot scope-matrix__dot--filtered"></span
        >{{ t('state.filtered') }}</span
      >
      <span class="scope-matrix__legend-item">
        <span class="scope-matrix__dot scope-matrix__dot--none"></span
        >{{ t('state.none') }}</span
      >
    </div>
  </section>
</ng-container>
