<div class="details-section">
  <div class="action-bar log-toolbar">
    <button mat-flat-button class="save-btn" (click)="goBack()">
      {{ 'goBack' | transloco }}
    </button>
    <span class="spacer"></span>
    <mat-slide-toggle
      [checked]="live"
      (change)="onLiveToggle($event.checked)"
      color="primary">
      {{ 'liveTail' | transloco }}
    </mat-slide-toggle>
  </div>
  <df-ace-editor
    [readonly]="true"
    [value]="content"
    class="full-width log-editor"></df-ace-editor>
</div>
